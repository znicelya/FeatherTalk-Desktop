[package]
name = "feathertalk-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
burn.workspace = true
burn-store.workspace = true
feathertalk-models = { path = "../feathertalk-models", default-features = false }
feathertalk-weights = { path = "../feathertalk-weights" }
hex.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
zip.workspace = true
