[package]
name = "feathertalk-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
feathertalk-client = { path = "../feathertalk-client" }
feathertalk-domain = { path = "../feathertalk-domain" }
feathertalk-project = { path = "../feathertalk-project" }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# A scripted worker for the process tests. Named differently from
# `feathertalk-client`'s fake worker so the two never collide in the shared
# workspace target directory.
[[bin]]
name = "feathertalk-supervised-fake-worker"
path = "tests/support/fake_worker.rs"
