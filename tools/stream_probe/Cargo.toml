[package]
name = "stream_probe"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone workspace; does not touch the FeatherTalk build.
[workspace]

[dependencies]
cubecl-cuda = { version = "=0.11.0", default-features = false, features = ["std"] }
cubecl-core = { version = "=0.11.0", default-features = false, features = ["std"] }
cubecl-runtime = { version = "=0.11.0", default-features = false, features = ["std", "channel-mutex"] }
# Match the FeatherTalk workspace pin: cubecl 0.11's cubecl-core requires pliron
# `^0.19`; pin the pair so a `cargo update` cannot drift them.
pliron = "=0.19.0"
pliron-derive = "=0.19.0"
# cubecl-cuda pulls cudarc with `cuda-version-from-build-system`, which on this
# host (11.8 also on PATH) resolves a binding lacking the CUtensorMap* types.
# Force the 12.8 bindings the way the FeatherTalk workspace does; the explicit
# feature wins in cudarc's build script.
cudarc = { version = "=0.19.9", default-features = false, features = ["std", "driver", "nvrtc", "nccl", "dynamic-loading", "cuda-12080"] }

[profile.release]
opt-level = 2


